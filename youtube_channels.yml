# 요약할 유튜브 채널 목록
#
# 각 항목에 url / handle / id 중 하나만 있으면 됩니다.
#   url:    https://www.youtube.com/@채널핸들  또는  .../channel/UCxxxxxxxx
#   handle: @채널핸들
#   id:     UCxxxxxxxxxxxxxxxxxxxxxx  (채널 ID를 이미 아는 경우 가장 빠름)
#
# name 은 요약 문서에 표시할 이름입니다. 비워두면 채널의 실제 이름을 자동으로 씁니다.

