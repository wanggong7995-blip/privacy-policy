# 테마별 주식 뉴스·유튜브 감시 설정
#
# theme_watch.py 가 이 파일을 읽어서 테마마다
#   1) 구글 뉴스에서 키워드로 기사를 모으고
#   2) 유튜브 검색 + 이미 등록된 채널(youtube_channels.yml)에서 영상을 모은 뒤
#   3) Claude로 "주목할 만한 것"을 골라 브리핑을 만든다.
#
# 항목 설명
#   name      : 리포트에 표시할 테마 이름
#   keywords  : 뉴스/영상 검색어. 많을수록 느려지므로 테마당 3~6개 권장.
#   tickers   : (선택) 리포트 머리말에 함께 적어둘 관련 종목. 수집에는 쓰이지 않는다.
#   enabled   : false 로 두면 그 테마는 건너뛴다.

themes:
  - name: 양자컴퓨팅
    keywords:
      - 양자컴퓨터 주가
      - 양자컴퓨팅 관련주
      - quantum computing stock
      - IonQ
      - 양자내성암호
    tickers: [IONQ, RGTI, QBTS, QUBT, 아이온큐]

  - name: 로봇·휴머노이드
    keywords:
      - 휴머노이드 로봇
      - 로봇 관련주
      - 테슬라 옵티머스
      - Figure AI humanoid
      - 협동로봇
    tickers: [TSLA, 레인보우로보틱스, 두산로보틱스, 에스피지, "0148J0.KS"]

  - name: AI 반도체·전력
    keywords:
      - HBM 수요
      - AI 데이터센터 전력
      - AI 반도체 관련주
      - 전력기기 수출
      - SMR 원전
    tickers: [NVDA, 삼성전자, SK하이닉스, HD현대일렉트릭, 두산에너빌리티]

  - name: 방산·우주
    keywords:
      - 방산 수출 수주
      - 방산주
      - 우주항공 관련주
      - 한화에어로스페이스
    tickers: [한화에어로스페이스, LIG넥스원, 현대로템, 한국항공우주]

  - name: 암호화폐·스테이블코인
    keywords:
      - 스테이블코인 법안
      - 원화 스테이블코인
      - 가상자산 규제
      - 비트코인 ETF 자금
      - 비트코인 시세
    tickers: [COIN, MSTR, 카카오페이, 다날, 헥토파이낸셜]

options:
  # 며칠치를 훑을지. 1이면 최근 24시간, 2면 이틀.
  lookback_days: 2

  # 테마 하나당 후보로 모을 최대 개수 (Claude에 넘기는 목록의 크기)
  max_news_candidates: 30
  max_video_candidates: 25

  # 테마 하나당 자막까지 받아 깊게 요약할 영상 수 (0이면 자막 요약 안 함)
  deep_videos_per_theme: 2

  # 브리핑에 실을 기사/영상 개수 (Claude가 이 수만큼 고른다)
  news_picks: 5
  video_picks: 3

  # 이미 등록된 유튜브 채널(youtube_channels.yml)에서도 키워드로 찾을지
  include_watchlist_channels: true

  # 자막 언어 우선순위
  languages: [ko, ko-KR, en]

  # 요약에 쓸 모델
  model: claude-opus-5
