name: 유튜브 일간 요약

on:
  schedule:
    # 매일 23:00 UTC = 다음 날 08:00 KST → 전날(KST) 방송을 요약한다
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "요약할 날짜 (KST, YYYY-MM-DD). 비우면 어제"
        required: false
        type: string
      days_back:
        description: "오늘 기준 며칠 전 (date를 비웠을 때만 사용)"
        required: false
        default: "1"
        type: string
      mode:
        description: "요약 실행 대신 진단만 하려면 diagnose 선택"
        required: false
        default: summary
        type: choice
        options:
          - summary
          - diagnose

concurrency:
  group: youtube-daily-summary
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    # 단계의 if: 에서는 secrets 컨텍스트를 참조할 수 없으므로 잡 수준 env로 올린다.
    # 구독 토큰이 있으면 구독 한도로, 없으면 API 크레딧으로 요약한다.
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.YOUTUBE_SUMMARY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-youtube.txt

      - name: 의존성 설치
        run: pip install -r requirements-youtube.txt

      # 구독 한도로 요약하려면 claude CLI가 필요하다.
      # 구독 토큰이 없으면 설치를 건너뛰고 API 크레딧 경로로 동작한다.
      - uses: actions/setup-node@v4
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        with:
          node-version: "22"

      - name: claude CLI 설치
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm install -g @anthropic-ai/claude-code

      - name: 인증 확인
        run: python youtube_daily.py --check-auth

      - name: 요약 생성
        env:
          # YouTube는 클라우드 IP의 자막 요청을 막는다. 아래 중 한 가지를 등록해야
          # Actions에서 자막을 받을 수 있다 (둘 다 없으면 영상 설명만으로 요약된다).
          WEBSHARE_PROXY_USERNAME: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
          WEBSHARE_PROXY_PASSWORD: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}
          YT_HTTP_PROXY: ${{ secrets.YT_HTTP_PROXY }}
          YT_HTTPS_PROXY: ${{ secrets.YT_HTTPS_PROXY }}
        run: |
          if [ "${{ inputs.mode }}" = "diagnose" ]; then
            python youtube_daily.py --diagnose
          elif [ -n "${{ inputs.date }}" ]; then
            python youtube_daily.py --date "${{ inputs.date }}"
          else
            python youtube_daily.py --days-back "${{ inputs.days_back || '1' }}"
          fi

      - name: 결과 커밋
        if: inputs.mode != 'diagnose'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add summaries
          [ -f .youtube_channel_cache.json ] && git add .youtube_channel_cache.json || true
          if git diff --staged --quiet; then
            echo "변경 사항이 없습니다."
            exit 0
          fi
          git commit -m "유튜브 일간 요약 자동 업데이트"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "푸시 실패, 재시도 ${i}"
            sleep $((2 ** i))
          done
          exit 1
